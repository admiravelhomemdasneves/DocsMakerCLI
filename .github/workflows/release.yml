name: release

# Push a tag like v1.0.0 to build installable archives for every OS and
# attach them, with checksums, to a DRAFT GitHub release: nothing is public
# until someone reviews the notes and presses "Publish release".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -File scripts/build.ps1
          else
            scripts/build.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --draft
